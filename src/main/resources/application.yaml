spring:
  application:
    name: gestion-transacciones
  spring:
    datasource:
      url: jdbc:mysql://mysql:3306/mydb
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQLDialect
